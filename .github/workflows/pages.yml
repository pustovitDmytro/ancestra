name: pages

on:
  push:
    branches-ignore:
      - gh-pages
      - 'renovate/**'
      - 'whitesource/**'
  delete:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IS_MAIN: ${{ github.ref_name == 'master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_STAND: ${{ github.ref_name != 'master' && github.ref_name || '' }}

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: ${{ env.IS_MAIN == 'true' && '.' || format('preview/{0}', github.ref_name) }}
          clean-exclude: |
            preview/**

      - name: Summary
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ "$IS_MAIN" = "true" ]; then url="$base/"; else url="$base/preview/$GITHUB_REF_NAME/"; fi
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove the branch preview
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          dir="preview/$BRANCH"
          if [ ! -d "$dir" ]; then
            echo "No preview at $dir"
            exit 0
          fi
          git rm -rq -- "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove preview for $BRANCH"
          git push
